name: Actualizar visuales del perfil

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-visuals.yml'
      - 'scripts/update_stats.py'
      - 'scripts/style_pacman.py'

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Obtener archivos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generar estadísticas públicas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: TomasGuF
        run: python3 scripts/update_stats.py

      - name: Generar Pac-Man con contribuciones reales
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: TomasGuF
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          hide_month_labels: 'false'

      - name: Aplicar la paleta del perfil
        run: python3 scripts/style_pacman.py

      - name: Generar serpiente verde con contribuciones reales
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: TomasGuF
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake-light.svg?color_snake=#39945c&color_dots=#e7ebe8,#c5e2cf,#89c5a0,#57a878,#2e7850
            assets/snake-dark.svg?palette=github-dark&color_snake=#63c287&color_dots=#2b3430,#254b34,#326d46,#489964,#70c58c

      - name: Publicar visuales generados
        run: |
          git add assets/github-stats.svg assets/languages.svg assets/pacman-light.svg assets/pacman-dark.svg assets/snake-light.svg assets/snake-dark.svg
          if git diff --staged --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: actualizar estadísticas y contribuciones animadas'
          git pull --rebase origin main
          git push
